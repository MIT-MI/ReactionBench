  <rect x="124" y="108" width="10" height="14" rx="2" fill="#6c3fa0"/>
  <rect x="139" y="100" width="10" height="22" rx="2" fill="#2f6fb5"/>
  <rect x="154" y="94" width="10" height="28" rx="2" fill="#3f8f4a"/>
