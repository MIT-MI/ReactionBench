      <stop offset="0" stop-color="#6c3fa0"/><stop offset="0.45" stop-color="#2f6fb5"/><stop offset="0.75" stop-color="#3f8f4a"/><stop offset="1" stop-color="#d9714a"/>
    </linearGradient>
  </defs>
  <!-- stimulus screen -->
  <rect x="14" y="34" width="78" height="56" rx="9" fill="#ffffff" stroke="#2f6fb5" stroke-width="4"/>
  <path d="M45 50 L45 74 L65 62 Z" fill="#2f6fb5"/>
  <rect x="38" y="96" width="30" height="5" rx="2.5" fill="#2f6fb5"/>
